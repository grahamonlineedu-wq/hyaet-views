<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech & Smart Home Insights | Grahm's TechBlog</title>
  <meta name="description" content="Latest insights on smart appliances, consumer electronics, IoT security, and modern home automation ecosystems.">
  
  <!-- OpenGraph Meta Tags for Social Media Sharing -->
  <meta property="og:title" content="Tech & Smart Home Insights">
  <meta property="og:description" content="Explore next-gen consumer electronics, AI kitchen appliances, and defensive IoT security.">
  <meta property="og:type" content="website">

  <!-- Inline SVG Favicon (Eliminates 404 errors) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <div class="container navbar">
      <h1 class="logo">DevBlog<span>.</span></h1>
      <nav>
        <a href="#">Home</a>
        <a href="#posts">Articles</a>
        <a href="#about">About</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h2>Thoughts, Tutorials & Code</h2>
      <p>A personal space dedicated to software engineering, architecture, and technology.</p>
    </section>
<section class="controls-section container">
  <!-- Search Input -->
  <div class="search-box">
    <input 
      type="text" 
      id="search-input" 
      placeholder="Search articles by title, keyword, or snippet..." 
      aria-label="Search articles"
    />
  </div>

    <!-- Category Filter Buttons -->
  <div class="filter-tags" id="category-filters">
    <button class="tag-btn active" data-category="all">All</button>
    <button class="tag-btn" data-category="Electronics">Electronics</button>
    <button class="tag-btn" data-category="Kitchen Tech">Kitchen Tech</button>
    <button class="tag-btn" data-category="Home Automation">Home Automation</button>
    <button class="tag-btn" data-category="Security">Security</button>
  </div>
</section>

<!-- Promotional Advert Banner -->
<section class="container advert-banner">
  <div class="advert-content">
    <span class="advert-badge">Featured Promo</span>
    <h3>Upgrade Your Smart Home Ecosystem</h3>
    <p>Get up to 30% off high-efficiency smart appliances & next-gen ambient lighting tech.</p>
    <a href="#posts" class="advert-btn">Explore Deals</a>
  </div>
</section>


  <main >
    <section id="posts" class="posts-grid">
      <!-- Posts dynamically injected by app.js -->
    </section>
  </main>

  <!-- Modal for Full Article View -->
  <div id="article-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <article id="full-article"></article>
    </div>
  </div>

  <script src="app.js">
let posts = [];
let activeCategory = "all";
let searchQuery = "";

function calculateReadTime(text) {
  const words = text ? text.trim().split(/\s+/).length : 0;
  return `${Math.ceil(words / 200)} min read`;
}

document.addEventListener("DOMContentLoaded", () => {
  const postsGrid = document.getElementById("posts");
  const searchInput = document.getElementById("search-input");
  const filterButtons = document.querySelectorAll(".tag-btn");

  // Fetch posts from Express + MongoDB backend
  async function fetchPosts() {
    try {
      const response = await fetch('/api/posts');
      posts = await response.json();
      renderPosts();
    } catch (error) {
      console.error('Error fetching articles:', error);
      postsGrid.innerHTML = `<p style="text-align:center; grid-column:1/-1;">Unable to load posts from database.</p>`;
    }
  }

  function renderPosts() {
    const filteredPosts = posts.filter(post => {
      const matchesCategory = activeCategory === "all" || post.category === activeCategory;
      const query = searchQuery.toLowerCase();
      const matchesSearch = post.title.toLowerCase().includes(query) ||
                            post.excerpt.toLowerCase().includes(query) ||
                            post.category.toLowerCase().includes(query);

      return matchesCategory && matchesSearch;
    });

    if (filteredPosts.length === 0) {
      postsGrid.innerHTML = `
        <div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--text-muted);">
          No articles found matching your criteria.
        </div>
      `;
      return;
    }

    postsGrid.innerHTML = filteredPosts.map(post => `
      <article class="card" onclick="openPost('${post._id}')">
        <div class="card-header">
          <span class="card-date">${post.date} • ${calculateReadTime(post.content)}</span>
          <span class="category-badge">${post.category}</span>
        </div>
        <h3>${post.title}</h3>
        <p>${post.excerpt}</p>
      </article>
    `).join("");
  }

  searchInput.addEventListener("input", (e) => {
    searchQuery = e.target.value;
    renderPosts();
  });

  filterButtons.forEach(button => {
    button.addEventListener("click", () => {
      filterButtons.forEach(btn => btn.classList.remove("active"));
      button.classList.add("active");
      activeCategory = button.getAttribute("data-category");
      renderPosts();
    });
  });

  fetchPosts();
});

function openPost(id) {
  const modal = document.getElementById("article-modal");
  const fullArticle = document.getElementById("full-article");
  const post = posts.find(p => p._id === id);
  if (!post) return;

  fullArticle.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 0.8rem;">
      <span style="color: var(--accent); font-size: 0.85rem;">${post.date} • ${calculateReadTime(post.content)}</span>
      <span class="category-badge">${post.category}</span>
    </div>
    <h2 style="margin-bottom: 1rem; color: var(--text-main);">${post.title}</h2>
    <div style="color: var(--text-muted); line-height: 1.7;">${post.content}</div>
  `;
  modal.style.display = "flex";
}

 </script>
</body>
</html>
