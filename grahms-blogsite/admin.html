cat << 'EOF' > admin.html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hyæt-views | Admin Portal</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 24px; border-radius: 12px; border: 1px solid #334155; }
    h1 { margin-top: 0; color: #38bdf8; }
    label { display: block; margin-top: 12px; font-weight: 600; color: #94a3b8; }
    input, select, textarea { width: 100%; padding: 10px; margin-top: 6px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; box-sizing: border-box; }
    button { margin-top: 20px; width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:hover { background: #0369a1; }
    #status { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>hyæt-views Admin Portal</h1>
    <p style="color: #94a3b8; font-size: 0.9em;">Turnkey Publishing Interface for Blog Managers</p>
    
    <label for="secret">Admin Secret Key</label>
    <input type="password" id="secret" placeholder="Enter admin passkey">

    <label for="title">Article Title</label>
    <input type="text" id="title" placeholder="e.g., Top 5 Web Development Tools">

    <label for="category">Category</label>
    <select id="category">
      <option value="Tech & Coding">Tech & Coding</option>
      <option value="Cybersecurity">Cybersecurity</option>
      <option value="Digital Growth">Digital Growth</option>
    </select>

    <label for="content">Article Content (HTML / Text)</label>
    <textarea id="content" rows="8" placeholder="Write or paste post content here..."></textarea>

    <button onclick="publishPost()">Publish Article</button>
    <div id="status"></div>
  </div>

  <script>
    async function publishPost() {
      const secret = document.getElementById('secret').value;
      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const content = document.getElementById('content').value;
      const statusDiv = document.getElementById('status');

      statusDiv.style.color = '#38bdf8';
      statusDiv.innerText = 'Publishing...';

      try {
        const response = await fetch('/api/admin/posts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ secret, title, category, content })
        });

        const data = await response.json();

        if (response.ok) {
          statusDiv.style.color = '#4ade80';
          statusDiv.innerText = 'Success: Article Published!';
          document.getElementById('title').value = '';
          document.getElementById('content').value = '';
        } else {
          statusDiv.style.color = '#f87171';
          statusDiv.innerText = 'Error: ' + data.error;
        }
      } catch (err) {
        statusDiv.style.color = '#f87171';
        statusDiv.innerText = 'Network error. Please try again.';
      }
    }
  </script>
</body>
</html>
EOF
