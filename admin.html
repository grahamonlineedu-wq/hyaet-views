<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendor & Admin Portal | Grahms</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; line-height: 1.6; }
    .container { max-width: 650px; margin: 0 auto; }
    .card { background: #1e293b; padding: 24px; border-radius: 16px; border: 1px solid #334155; margin-bottom: 24px; }
    h2 { margin-top: 0; color: #ffd200; }
    label { font-size: 0.85rem; color: #94a3b8; display: block; margin-top: 10px; }
    input, textarea { width: 100%; padding: 10px; margin-top: 4px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
    button { background: #ffd200; color: #000; font-weight: 800; padding: 12px; border: none; border-radius: 8px; width: 100%; margin-top: 15px; cursor: pointer; }
    .order-item { border-bottom: 1px solid #334155; padding: 10px 0; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2>Add Product to Catalog</h2>
      <label>Admin Secret</label>
      <input type="password" id="secret" value="grahms_admin_2026">
      <label>Product Name</label>
      <input type="text" id="name" placeholder="e.g. MacBook Pro M3">
      <label>Vendor Name</label>
      <input type="text" id="vendor" placeholder="e.g. iStore Lagos">
      <label>Selling Price (₦)</label>
      <input type="number" id="price" placeholder="1200000">
      <label>Original Price (₦)</label>
      <input type="number" id="originalPrice" placeholder="1350000">
      <label>Image URL</label>
      <input type="text" id="imageUrl" placeholder="https://images.unsplash.com/...">
      <label>Description</label>
      <textarea id="description" rows="3"></textarea>
      <button onclick="addProduct()">Publish Product 🚀</button>
    </div>

    <div class="card">
      <h2>Live Order Log</h2>
      <div id="orders-log">Loading orders...</div>
    </div>
  </div>

  <script>
    async function addProduct() {
      const payload = {
        secret: document.getElementById('secret').value,
        name: document.getElementById('name').value,
        vendor: document.getElementById('vendor').value,
        price: Number(document.getElementById('price').value),
        originalPrice: Number(document.getElementById('originalPrice').value),
        imageUrl: document.getElementById('imageUrl').value,
        description: document.getElementById('description').value
      };

      const res = await fetch('/api/admin/products', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      alert(data.message || data.error);
    }

    async function loadOrders() {
      const log = document.getElementById('orders-log');
      try {
        const res = await fetch('/api/admin/orders');
        const orders = await res.json();
        if (orders.length === 0) {
          log.innerHTML = '<p style="color: #94a3b8;">No orders recorded yet.</p>';
          return;
        }
        log.innerHTML = orders.map(o => `
          <div class="order-item">
            <strong>${o.productName}</strong> - ₦${o.price.toLocaleString()} <br>
            <span style="color: #94a3b8;">Customer: ${o.customerEmail} | Status: ${o.status}</span>
          </div>
        `).join('');
      } catch (err) {
        log.innerHTML = '<p>Error loading orders.</p>';
      }
    }

    loadOrders();
  </script>
</body>
</html>
